<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat to agent</title>
  <link rel="stylesheet" href="./static/chat_to_agent.css">
  
  <!-- Open sans font settings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <!-- Icon settings -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_upward" />

</head>

<body>
 <div class="container">
   <main>
     <div class="message-container">
        <div class="user-widget">
          <p>{{ u }}</p>
        </div>
        <div class="agent-res">
          <p>{{ r }}</p>
        </div>
     </div>
     <div class="chat-input-sec">
       <form method="post">
          <input type="text" placeholder="Ask to Crimi" name="user-input">
          <button class="send-btn">
            <span class="material-symbols-outlined">arrow_upward</span>
          </button>
       </form>
     </div>
   </main>
 </div>
</body>

</html>
