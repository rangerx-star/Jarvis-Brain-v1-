<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat to Crimi</title>
  <link rel="stylesheet" href="./static/chat.css">
  <!-- Rubik fonts settings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <!-- Open sans font settings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <!-- Icon settings -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_upward" />
</head>

<body>
  <div class="container">
    <header>
      <div class="greeting">
        <h1>Hello There</h1>
        <h2>How can i help you today?</h2>
      </div>
    </header>
    <main>
      <div class="chat-sec">
        <form action="/chat_to_agent" method="post">
          <input type="text" placeholder="Ask to Crimi" name="user_input">
          <button class="send-btn" type="submit">
            <span class="material-symbols-outlined">arrow_upward</span>
          </button>
        </form>
      </div>
    </main>
  </div>
</body>

</html>
